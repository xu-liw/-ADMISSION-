<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ADMISSION</title>
  <meta name="description" content="ADMISSION">
  <meta property="og:title" content="ADMISSION">
  <meta property="og:description" content="ADMISSION">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #000000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      position: fixed;
    }

    /* 非手機或手機橫躺提示遮罩 */
    .device-guard {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #000000;
      z-index: 999999;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    .device-guard img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      z-index: 0;
    }

    .device-guard-scrim {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      z-index: 1;
    }

    .device-guard p {
      position: relative;
      z-index: 2;
      color: #ffffff;
      font-size: 18px;
      font-weight: 300;
      letter-spacing: 1px;
      padding: 0 20px;
    }

    /* 當螢幕為橫躺 (landscape) 或非直式手機 (寬度 > 520px) 時，啟動遮罩 */
    @media screen and (orientation: landscape), screen and (min-width: 521px) {
      .device-guard {
        display: flex;
      }
      .slider-viewport {
        display: none !important;
      }
    }

    .slider-viewport {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: relative;
      touch-action: pan-y;
      cursor: grab;
    }

    .slider-viewport:active {
      cursor: grabbing;
    }

    /* 3 面板動態虛擬軌道，基底為 -100vw */
    .slider-track {
      display: flex;
      flex-direction: row;
      width: 300vw;
      height: 100%;
      will-change: transform;
      transform: translate3d(-100vw, 0, 0);
    }

    .slide-panel {
      flex: 0 0 100vw;
      width: 100vw;
      height: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000000;
      overflow: hidden;
    }

    .slide-panel img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    /* 第 1 頁毛玻璃向左滑動手勢引導 */
    .swipe-hint {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      color: rgba(255, 255, 255, 0.95);
      pointer-events: none;
      z-index: 20;
      opacity: 1;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity;
    }

    .swipe-hint-inner {
      width: 24px;
      height: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: arrow-nudge 1.6s infinite ease-in-out;
    }

    .swipe-hint svg {
      width: 20px;
      height: 20px;
      display: block;
      margin: auto;
    }

    @keyframes arrow-nudge {
      0%, 100% {
        transform: translateX(0);
        opacity: 0.75;
      }
      50% {
        transform: translateX(-5px);
        opacity: 1;
      }
    }

    /* 第 7 頁結尾資訊頁按鈕 */
    .end-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 10;
      position: relative;
    }

    .action-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      text-decoration: none;
      cursor: pointer;
      outline: none;
      transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.18s ease;
      touch-action: manipulation;
    }

    .action-icon:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .action-icon:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.28);
    }

    .action-icon svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .toast {
      position: fixed;
      bottom: calc(40px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(20, 20, 20, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 24px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <!-- 非直立手機提示層 -->
  <div class="device-guard">
    <img src="slide-7.png" alt="">
    <div class="device-guard-scrim"></div>
    <p>Please use phones vertically.</p>
  </div>

  <div class="slider-viewport" id="viewport">
    <div class="slider-track" id="track">
      <div class="slide-panel" id="panel-prev"></div>
      <div class="slide-panel" id="panel-center"></div>
      <div class="slide-panel" id="panel-next"></div>
    </div>
  </div>

  <div class="toast" id="toast">連結已複製至剪貼簿</div>

  <script>
    (function () {
      const TOTAL_SLIDES = 7;
      const TITLE = 'ADMISSION';
      const INSTAGRAM_URL = 'https://www.instagram.com/xu_liw/';
      const YOUTUBE_URL = 'https://www.youtube.com/@liwei180';

      const viewport = document.getElementById('viewport');
      const track = document.getElementById('track');
      const panelPrev = document.getElementById('panel-prev');
      const panelCenter = document.getElementById('panel-center');
      const panelNext = document.getElementById('panel-next');
      const toast = document.getElementById('toast');

      let currentIndex = 0; // 0..6 對應 Slide 1..7
      let isAnimating = false;
      let isDragging = false;
      let startX = 0;
      let dragOffset = 0;
      let startTime = 0;
      let hintVisible = true;
      let toastTimer = null;
      let wheelLocked = false;

      // 2 秒後提示淡出
      setTimeout(() => {
        hintVisible = false;
        const hintEl = document.getElementById('hint');
        if (hintEl) hintEl.style.opacity = '0';
      }, 2000);

      function createSlideHTML(idx, isCenter) {
        if (idx === 6) {
          return `
            <img src="slide-7.png" alt="" class="bg-img" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:0;">
            <div class="end-actions">
              <button class="action-icon share-btn" title="分享" aria-label="分享">
                <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
              </button>
              <a class="action-icon" href="${INSTAGRAM_URL}" target="_blank" rel="noopener noreferrer" title="Instagram" aria-label="Instagram">
                <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
              </a>
              <a class="action-icon" href="${YOUTUBE_URL}" target="_blank" rel="noopener noreferrer" title="YouTube" aria-label="YouTube">
                <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
              </a>
            </div>
          `;
        }

        const hintHTML = (idx === 0) ? `
          <div class="swipe-hint" id="hint" style="opacity:${(hintVisible && isCenter) ? '1' : '0'};">
            <div class="swipe-hint-inner">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </div>
          </div>
        ` : '';

        return `
          <img src="slide-${idx + 1}.png" alt="">
          ${hintHTML}
        `;
      }

      function updatePanels() {
        const prevIdx = (currentIndex - 1 + TOTAL_SLIDES) % TOTAL_SLIDES;
        const nextIdx = (currentIndex + 1) % TOTAL_SLIDES;

        panelPrev.innerHTML = createSlideHTML(prevIdx, false);
        panelCenter.innerHTML = createSlideHTML(currentIndex, true);
        panelNext.innerHTML = createSlideHTML(nextIdx, false);

        const shareBtns = document.querySelectorAll('.share-btn');
        shareBtns.forEach(btn => {
          btn.onclick = async (e) => {
            e.preventDefault();
            if (navigator.vibrate) try { navigator.vibrate(15); } catch(e){}
            const shareData = { title: TITLE, text: TITLE, url: window.location.href };
            if (navigator.share) {
              try { await navigator.share(shareData); }
              catch(err) { if (err.name !== 'AbortError') copyLink(); }
            } else {
              copyLink();
            }
          };
        });
      }

      function nextSlide() {
        if (isAnimating) return;
        isAnimating = true;
        hintVisible = false;
        const hintEl = document.getElementById('hint');
        if (hintEl) hintEl.style.opacity = '0';

        track.style.transition = 'transform 0.55s cubic-bezier(0.16, 1, 0.3, 1)';
        track.style.transform = 'translate3d(-200vw, 0, 0)';

        setTimeout(() => {
          currentIndex = (currentIndex + 1) % TOTAL_SLIDES;
          updatePanels();
          track.style.transition = 'none';
          track.style.transform = 'translate3d(-100vw, 0, 0)';
          isAnimating = false;
        }, 550);
      }

      function prevSlide() {
        if (isAnimating) return;
        isAnimating = true;
        hintVisible = false;
        const hintEl = document.getElementById('hint');
        if (hintEl) hintEl.style.opacity = '0';

        track.style.transition = 'transform 0.55s cubic-bezier(0.16, 1, 0.3, 1)';
        track.style.transform = 'translate3d(0vw, 0, 0)';

        setTimeout(() => {
          currentIndex = (currentIndex - 1 + TOTAL_SLIDES) % TOTAL_SLIDES;
          updatePanels();
          track.style.transition = 'none';
          track.style.transform = 'translate3d(-100vw, 0, 0)';
          isAnimating = false;
        }, 550);
      }

      function onPointerDown(clientX) {
        if (isAnimating) return;
        isDragging = true;
        startX = clientX;
        startTime = Date.now();
        dragOffset = 0;
        track.style.transition = 'none';
      }

      function onPointerMove(clientX) {
        if (!isDragging || isAnimating) return;
        dragOffset = clientX - startX;
        track.style.transform = 'translate3d(calc(-100vw + ' + dragOffset + 'px), 0, 0)';
        if (Math.abs(dragOffset) > 15) {
          hintVisible = false;
          const hintEl = document.getElementById('hint');
          if (hintEl) hintEl.style.opacity = '0';
        }
      }

      function onPointerUp() {
        if (!isDragging || isAnimating) return;
        isDragging = false;
        const width = window.innerWidth;
        const elapsed = Date.now() - startTime;
        const isFlick = elapsed < 250 && Math.abs(dragOffset) > 30;
        const isSwipe = Math.abs(dragOffset) > width * 0.16;

        if (dragOffset < 0 && (isFlick || isSwipe)) {
          nextSlide();
        } else if (dragOffset > 0 && (isFlick || isSwipe)) {
          prevSlide();
        } else {
          track.style.transition = 'transform 0.35s cubic-bezier(0.16, 1, 0.3, 1)';
          track.style.transform = 'translate3d(-100vw, 0, 0)';
        }
      }

      viewport.addEventListener('mousedown', (e) => onPointerDown(e.clientX));
      window.addEventListener('mousemove', (e) => onPointerMove(e.clientX));
      window.addEventListener('mouseup', onPointerUp);

      viewport.addEventListener('touchstart', (e) => onPointerDown(e.touches[0].clientX), { passive: true });
      viewport.addEventListener('touchmove', (e) => onPointerMove(e.touches[0].clientX), { passive: true });
      viewport.addEventListener('touchend', onPointerUp);

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'PageDown') nextSlide();
        if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
      });

      viewport.addEventListener('wheel', (e) => {
        const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
        if (Math.abs(delta) < 25 || wheelLocked) return;
        wheelLocked = true;
        if (delta > 0) nextSlide();
        else prevSlide();
        setTimeout(() => { wheelLocked = false; }, 600);
      }, { passive: true });

      function showToast(text) {
        if (toastTimer) clearTimeout(toastTimer);
        toast.textContent = text;
        toast.classList.add('show');
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
      }

      function copyLink() {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(window.location.href)
            .then(() => showToast('連結已複製至剪貼簿'))
            .catch(() => fallbackCopy());
        } else {
          fallbackCopy();
        }
      }

      function fallbackCopy() {
        try {
          const input = document.createElement('input');
          input.value = window.location.href;
          document.body.appendChild(input);
          input.select();
          document.execCommand('copy');
          document.body.removeChild(input);
          showToast('連結已複製至剪貼簿');
        } catch (e) {
          showToast('請直接複製網址');
        }
      }

      updatePanels();
    })();
  </script>
</body>
</html>
